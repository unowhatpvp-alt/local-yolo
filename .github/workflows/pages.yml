name: Gated production Pages release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-yolo-production-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: tests/fixtures
          key: yolo26-fixtures-${{ hashFiles('src/core/model-manifest.json') }}
      - name: Install real-video validation dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
      - name: Verify preserved complete model evidence
        run: node scripts/verify-model-evidence.mjs
      - name: Fetch required integration fixtures
        run: |
          node scripts/fetch-yolo26-models.mjs --size=N
          node scripts/fetch-yolo26-validation-fixtures.mjs
      - name: Unit, geometry, lifecycle and PWA checks
        run: npm test
        env:
          FETCH_E2E_FIXTURES: '1'
      - run: npm run build
      - name: Install pinned CI browser test runner
        run: |
          npm install --prefix /tmp/local-yolo-browser-qa --no-save playwright@1.64.1
          /tmp/local-yolo-browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Execute real browser backend and PWA release integration
        run: node scripts/validate-browser-release.mjs
      - name: Refuse publication without current complete model, browser and PWA evidence
        run: node scripts/check-release-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-release-evidence-${{ github.sha }}
          path: |
            docs/model-validation-matrix.json
            docs/browser-validation-matrix.json
            docs/pwa-validation.json
            test-results/browser-release/
          if-no-files-found: warn
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy only the artifact that passed the release gate
        id: deployment
        uses: actions/deploy-pages@v4
